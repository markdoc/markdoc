name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        id: node
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-turbo-
      - name: Install and check workspaces
        run: |
          pnpm install --frozen-lockfile
          pnpm run check

  nextjs-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Test Next.js integration on Windows
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run test --filter=@markdoc/next.js
